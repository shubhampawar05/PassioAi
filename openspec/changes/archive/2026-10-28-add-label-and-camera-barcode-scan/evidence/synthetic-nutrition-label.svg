  <text x="28" y="296" font-size="17"><tspan font-weight="bold">Total Fat</tspan> 16g</text><text x="392" y="296" font-size="17" font-weight="bold" text-anchor="end">21%</text>
  <line x1="28" y1="306" x2="392" y2="306" stroke="#000"/>
  <text x="48" y="328" font-size="17">Saturated Fat 3g</text><text x="392" y="328" font-size="17" font-weight="bold" text-anchor="end">15%</text>
